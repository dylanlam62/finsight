[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents-ui-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "deepagents>=0.6.1",
    "langchain-openai>=0.1",
    "langchain-core>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
